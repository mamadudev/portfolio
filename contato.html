<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Mamadou Diagne | contato</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projeto Portfólio">
    <meta name="author" content="Mamadou Diagne">
    <meta name="keywords" content="Mamadou Diagne, Desenvolvedor Full Stack, HTML, CSS, JavaScript">
    <link rel="icon" type="image/svg+xml" href="./assets/img/logo.jpeg" />

    <!-- Link para a Folha de Estilo da Página - CSS -->
	<link rel="stylesheet" href="./assets/css/style.css" />

    <title>Contato</title>
</head>

<body>

    <!-- Cabeçalho da Página (header) -->
    <header>

        <!-- Título do cabeçalho -->
        <h1>Generation Brasil</h1>

        <!-- Menu de Navegação -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>

    </header>

    <!-- Seção Principal da Página (main) -->
    <main class="main_contato">

        <!-- Seção do Formulário -->
        <form action="#" method="submit" id="formulario">

            <label for="nome">Nome: </label>
            <input id="name" type="text" name="name" placeholder="Digite seu nome" />
            <span id="errNome"></span>

            <label for="email">Email: </label>
            <input id="email" type="text" name="email" placeholder="Digite seu email" />
            <span id="errEmail"></span>

            <label for="subject">Assunto: </label>
            <input id="subject" type="text" name="subject" placeholder="Digite o assunto da mensagem" />
            <span id="errSubject"></span>

            <label for="message">Mensagem: </label>
            <textarea id="message" name="message" placeholder="Digite sua mensagem"></textarea>

            <button type="submit">Enviar</button>

        </form>

        <!-- Seção do Google Maps -->
        <article class="article_mapa">

            <address>
                <p>avenida independencia 990</p>
                <p>Porto Alegre - RS</p>
            </address>

            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3454.4542024862573!2d-51.21779762478787!3d-30.034647981847665!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9519796dfe6f6b7d%3A0x8c5f5a2b5f4e0e0!2sAv.%20Independ%C3%AAncia%2C%20990%20-%20Independ%C3%AAncia%2C%20Porto%20Alegre%20-%20RS%2C%2090110-002!5e0!3m2!1spt-BR!2sbr!4v1696224866595!5m2!1spt-BR!2sbr"
                width="400"
                height="250"
                frameborder="0"
                style="border: 0"
                allowfullscreen
                aria-hidden="false"
                tabindex="0"
            ></iframe>

        </article>


    </main>

    <!-- Rodapé da Página (footer) -->
    <footer>

        <!-- Seção de Contato - Redes Sociais-->
        <section>

            <a href="https://www.linkedin.com/in/mamadudev">
                <img src="assets/img/linkedin.svg" alt="LinkedIn" />
            </a>

            <a href="https://github.com/mamadudev">
                <img src="assets/img/github.svg" alt="Github" />
            </a>

            <a href="https://www.instagram.com/diagne_momo">
                <img src="assets/img/instagram.svg" alt="Instagram" />
            </a>

        </section>

        <h3>
            Feito com 🧡 por Mamadou Diagne - 2026
        </h3>

    </footer>

    <!-- Script JavaScript-->
    <script src="assets/js/script.js"></script>
